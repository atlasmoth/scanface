name: ScanFace
options:
  bundleIdPrefix: app.scanface
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.1"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    FRAMEWORK_SEARCH_PATHS:
      - "$(inherited)"
      - "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
    OTHER_LDFLAGS:
      - "$(inherited)"
      - "-framework"
      - "ScanFaceKit"
targets:
  ScanFace:
    type: application
    platform: iOS
    sources:
      - path: ScanFace
    info:
      path: ScanFace/Info.plist
      properties:
        CFBundleDisplayName: ScanFace
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CADisableMinimumFrameDurationOnPhone: true
        NSCameraUsageDescription: ScanFace uses the camera to capture your face for on-device analysis. Photos stay on your device.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.scanface.ios
        GENERATE_INFOPLIST_FILE: NO
    preBuildScripts:
      - name: Build shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          set -e
          cd "$SRCROOT/.."
          if [ -n "$JAVA_HOME" ]; then
            export JAVA_HOME
          else
            export JAVA_HOME=$(/usr/libexec/java_home -v 17)
          fi
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
  ScanFaceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ScanFaceTests]
    dependencies:
      - target: ScanFace
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.scanface.tests
  ScanFaceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ScanFaceUITests]
    dependencies:
      - target: ScanFace
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.scanface.uitests
schemes:
  ScanFace:
    build:
      targets:
        ScanFace: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ScanFaceTests
        - ScanFaceUITests
